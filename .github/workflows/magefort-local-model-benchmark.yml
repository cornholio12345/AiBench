name: Magefort local-model benchmark

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: magefort-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - id: qwen35-4b
            model: qwen3.5:4b
          - id: gemma3-4b
            model: gemma3:4b
          - id: ministral3-3b
            model: ministral-3:3b
          - id: phi4mini-38b
            model: phi4-mini:3.8b
          - id: llama32-3b
            model: llama3.2:3b

    steps:
      - uses: actions/checkout@v7

      - name: Restore latest checkpoint
        id: restore-checkpoint
        uses: actions/cache/restore@v5
        with:
          path: results
          key: magefort-${{ matrix.id }}-${{ github.event.pull_request.number || 'manual' }}-${{ github.run_id }}-bootstrap
          restore-keys: |
            magefort-${{ matrix.id }}-${{ github.event.pull_request.number || 'manual' }}-

      - name: Runner info
        run: |
          echo "CPUs: $(nproc)"
          free -h
          df -h /

      - name: Install Ollama
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version
          sudo systemctl stop ollama 2>/dev/null || true
          pkill -f 'ollama serve' 2>/dev/null || true

      - name: Start Ollama
        shell: bash
        run: |
          set -euo pipefail
          nohup env OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=1 ollama serve > /tmp/ollama.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:11434/api/version; then exit 0; fi
            sleep 1
          done
          cat /tmp/ollama.log
          exit 1

      - name: Pull model
        run: ollama pull "${{ matrix.model }}"

      - name: konservativ story step 01
        run: >-
          python3 benchmark.py --model "${{ matrix.model }}" --canon canon/magefort-canon.json --out results --profile konservativ --step 1
      - name: Save checkpoint konservativ-01
        uses: actions/cache/save@v5
        with:
          path: results
          key: magefort-${{ matrix.id }}-${{ github.event.pull_request.number || 'manual' }}-${{ github.run_id }}-konservativ-01

      - name: konservativ story step 02
        run: >-
          python3 benchmark.py --model "${{ matrix.model }}" --canon canon/magefort-canon.json --out results --profile konservativ --step 2
      - name: Save checkpoint konservativ-02
