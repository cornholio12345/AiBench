        with:
          path: results
          key: magefort-${{ matrix.id }}-${{ github.event.pull_request.number || 'manual' }}-${{ github.run_id }}-konservativ-02

      - name: konservativ story step 03
        run: >-
          python3 benchmark.py --model "${{ matrix.model }}" --canon canon/magefort-canon.json --out results --profile konservativ --step 3
      - name: Save checkpoint konservativ-03
